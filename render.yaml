# Render Blueprint Specification for Standalone PocketBase Deployment
services:
  - type: web
    name: pixelforge-db
    env: docker
    dockerfilePath: Dockerfile
    plan: free # Change to starter/paid for persistent disk support in production
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 8080
    # Mount a persistent volume to preserve SQLite database contents and files across restarts
    disk:
      name: pb-data
      mountPath: /pb/pb_data
      sizeGB: 1
