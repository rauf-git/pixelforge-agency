# Fly.io configuration for deploying PocketBase with persistent storage
app = "pixelforge-db"
primary_region = "lax" # Change to your closest Fly.io region (e.g. ams, cdg, sin, etc.)

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"

# Mount a persistent volume to preserve SQLite database contents and files across restarts
[[mounts]]
  source = "pb_data"
  destination = "/pb/pb_data"
  initial_size = "1GB"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[http_service.concurrency]
  type = "connections"
  hard_limit = 25
  soft_limit = 20
