version: '3.8'

services:
  # 1. PocketBase Database & Storage Service
  pocketbase:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pixelforge-db
    expose:
      - "8080"
    volumes:
      - pb_data:/pb/pb_data
    restart: always
    environment:
      - PORT=8080

  # 2. Next.js Agency Frontend Website
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.next
      args:
        - NEXT_PUBLIC_POCKETBASE_URL=https://api.upscalemark.com
    container_name: pixelforge-web
    expose:
      - "3000"
    restart: always
    depends_on:
      - pocketbase

  # 3. Caddy Reverse Proxy & SSL Gatekeeper
  caddy:
    image: caddy:2-alpine
    container_name: caddy-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - pocketbase

volumes:
  # This creates a persistent volume on your Oracle host's NVMe SSD
  # to store your SQLite database and uploaded files permanently.
  pb_data:
  # These store SSL/TLS certificates and configurations securely
  caddy_data:
  caddy_config:

