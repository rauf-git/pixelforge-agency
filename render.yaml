# Render Blueprint Specification for Unified PocketBase & Next.js Deployment
services:
  # 1. PocketBase Database Service
  - type: web
    name: pixelforge-db
    env: docker
    dockerfilePath: Dockerfile
    plan: free # Change to starter/paid for persistent disk support in production
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 8080
    # Mount a persistent volume to preserve SQLite database contents and files across restarts
    disk:
      name: pb-data
      mountPath: /pb/pb_data
      sizeGB: 1

  # 2. Next.js Website Frontend Service
  - type: web
    name: pixelforge-web
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      # Render will automatically fetch the public URL of 'pixelforge-db' 
      # and inject it directly into our Next.js frontend at build-time!
      - key: NEXT_PUBLIC_POCKETBASE_URL
        fromService:
          type: web
          name: pixelforge-db
          property: url
